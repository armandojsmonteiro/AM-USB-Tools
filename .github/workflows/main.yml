name: Build AM USB Tools APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar projeto Android
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'AM_USB_Tools*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: Não foi encontrado o ZIP da AM USB Tools."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"

          rm -rf project
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

          echo "Conteúdo do projeto:"
          find project -maxdepth 3 -type f | sort

          if [ ! -f "project/settings.gradle.kts" ] && [ ! -f "project/settings.gradle" ]; then
            echo "ERRO: O ZIP não contém um projeto Gradle válido."
            exit 1
          fi

          echo "PROJECT_DIR=project" >> "$GITHUB_ENV"

      - name: Construir APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        shell: bash
        run: |
          set -e
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "AM USB Tools.apk"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: AM USB Tools
          path: "AM USB Tools.apk"
          if-no-files-found: error
